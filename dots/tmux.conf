
# ========== GENERAL ==========

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -g history-limit 20000
set -sg escape-time 0
set -g display-time 1000
set -g repeat-time 300
set -g renumber-windows on
setw -g allow-rename off
setw -g automatic-rename on
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action other
set -g allow-passthrough on
set -g set-clipboard on
# killing the current session moves the client to the last session instead of
# detaching
set -g detach-on-destroy off
set -ga terminal-features "*:hyperlinks"   # pass OSC 8 clickable links through to the terminal

# vim keys
setw -g mode-keys vi

# turn on mouse, and set toggle mouse mode with prefix+m
set-option -g mouse on
bind-key m set -g mouse\; display-message "mouse is now #{?mouse,on,off}"
# disable jump to bottom when highlighting text with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# must be enabled for vim-tmux-focus-events
set -g focus-events on

# number windows/panes starting at 1
set -g base-index 1
setw -g pane-base-index 1

# Set parent terminal title to reflect current window in tmux session 
set -g set-titles on
set -g set-titles-string "#I:#W"
# set -g set-titles-string '#(whoami)@#h(#(curl ipecho.net/plain;echo))'


# ========== MAPPINGS ==========

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# new window goes to home
bind c new-window -c "$HOME"

# new window splits retain CWD
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# pane synchronization
bind S set synchronize-panes

# close the current session (hub + its agent) with confirmation
bind Q confirm-before -p "kill session #S? (y/n)" kill-session

# Movement of windows with Prefix + < and Prefix + >:
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# start with empty string when renaming windows/sessions
bind , command-prompt -p "(rename-window '#W')" "rename-window '%%'"
bind '$' command-prompt -p "(rename-session '#S')" "rename-session '%%'"

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

# bind visual mode/yank to v/y in copy mode
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi y     send-keys -X copy-selection

# open the newest web URL in the current pane, skipping the picker
# (companion to the prefix+u picker from the tmux-fzf-url plugin below —
# shares its extraction, filtered to http(s) so claude's ubiquitous file://
# tool-use links don't shadow the URL you actually want)
bind-key U run-shell "~/dotfiles/bin/tmux-url-latest"

# picker - fuzzy find and switch to project sessions (deck pick)
bind-key -n C-f run-shell "tmux neww deck pick"
# copy-mode-vi binds C-f to page-down by default, which would swallow the key
# in a scrolled-up pane; bound here too, the pane keeps its scroll position.
bind-key -T copy-mode-vi C-f run-shell "tmux neww deck pick"
# C-o is unbound in copy mode and so dropped there; Claude Code needs the pane
# at the bottom to redraw anyway, so leave copy mode and hand the key on.
bind-key -T copy-mode-vi C-o send-keys -X cancel \; send-keys C-o

# agents screen - every agent pane, in deck's home session
bind-key -n C-g run-shell -E "deck open agents"

# feed - deck's Feed screen in its home session. Wrapped in the same is-vim
# passthrough idiom vim-tmux-navigator uses for its own C-h/j/k/l bindings
# above (`ps` the pane's foreground process, regex-match against
# vim/view/fzf): C-e is vim's scroll-line-down, so a pane running vim/fzf
# gets the key forwarded untouched.
bind-key -n C-e if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-e" 'run-shell -E "deck open feed"'

# toggle between current and last session — instant, no picker scan
# (note: shadows readline C-t transpose-chars inside shells)
bind-key -n C-t switch-client -l

# deck's "visited" signal: a pane deck lists as DONE stays so until its window
# is actually on screen. `deck hook seen <session>` records every pane on the
# session's CURRENT window, only when a client is attached to it, so a flag in
# window 4 survives attaching-and-looking-at-window-1. Three triggers: attach,
# client switching sessions, and the session's active window changing
# (session-window-changed is a control-mode notification, and "all the
# notifications ... are hooks" per the man page; it also fires when scripts
# select-window in detached sessions, which the attached-client gate absorbs).
# (#{q:...} quotes for the shell run-shell hands this to — cheap hardening
# against a session name with spaces/metacharacters; all current name
# sources are sanitized, so this is currently a no-op in practice)
set-hook -g client-attached 'run-shell "deck hook seen \"#{q:client_session}\""'
set-hook -g client-session-changed 'run-shell "deck hook seen \"#{q:client_session}\""'
set-hook -g session-window-changed 'run-shell "deck hook seen \"#{q:hook_session_name}\""'

# hex codes for next/prev window
# next        0x02 0x6E
# previous    0x02 0x70
# bind -n C-S-[ previous-window
# bind -n C-S-] next-window


# ========== STATUS BAR ==========

set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-right-length 100

# let catppuccin handle window styling
set-window-option -g window-status-current-format '#I #W'
set-window-option -g window-status-format '#I #W'

# when window has monitoring notification
setw -g window-status-activity-style "fg=white"

bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  refresh-client -S

# show OFF when F12 disables keys (for nested tmux)
wg_is_keys_off="#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"

set -g status-left ""
set -g status-right "${wg_is_keys_off}#{E:@catppuccin_status_session}"

# if were SSH'd in somewhere, load the remote.conf
if-shell 'test -n "$SSH_CLIENT"' 'source-file ~/.tmux.remote.conf'


# ========== ENV ==========

set -g update-environment \
  "DISPLAY\
  SSH_ASKPASS\
  SSH_AUTH_SOCK\
  SSH_AGENT_PID\
  SSH_CONNECTION\
  SSH_TTY\
  WINDOWID\
  XAUTHORITY"


# ========== PLUGINS ==========

set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'

# vim-like pane navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# catppuccin color scheme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_text "#[fg=#{@thm_overlay_1}] #W"
set -g @catppuccin_window_current_text "#[fg=#{@thm_fg},bold] #W"

# Inactive tabs sit flat on the bar (mantle, the status background); the
# current one is the only filled pill.
# The plugin hardcodes fg=crust on the number badge, invisible on a mantle
# fill, so the inactive number carries its own #[fg=] — same trick as the
# tint above, and it survives to render time for the same reason.
set -g @catppuccin_window_number_color "#{@thm_mantle}"
set -g @catppuccin_window_text_color "#{@thm_mantle}"
set -g @catppuccin_window_number "#[fg=#{@thm_overlay_0}]#I"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_2}"

# fuzzy-pick URLs from the current pane and open in browser (prefix+u).
# Complements Ghostty's cmd+shift+hover+click (shift required: mouse-on tmux
# and Claude Code's TUI capture mouse reporting, so unshifted clicks never
# reach Ghostty's link handler), which breaks on URLs that wrap/truncate
# inside tmux — the plugin captures with `capture-pane -J` so wrapped URLs
# stay intact.
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-history-limit '2000'

# system clipboard in copy mode (uses pbcopy on Mac, xclip on Linux)
set -g @plugin 'tmux-plugins/tmux-yank'
# stay in copy mode after yank (don't exit + jump cursor back to bottom)
set -g @yank_action 'copy-pipe'

# CPU/MEM for status line
# set -g @plugin 'samoshkin/tmux-plugin-sysstat'

# yet another CPU plugin
# set -g @plugin 'tmux-plugins/tmux-cpu'

# TPM binds prefix+U to "update plugins" by default, clobbering the
# tmux-url-latest binding above (tpm runs last); move plugin-update to M-u
set -g @tpm-update 'M-u'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
