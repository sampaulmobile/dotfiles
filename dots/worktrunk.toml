# worktrunk user config — symlinked to ~/.config/worktrunk/config.toml
# Hub-model tmux glue: wt switch lands you in a tmux SESSION for the
# worktree (never a cd — the zshrc wt() wrapper passes --no-cd); removal
# kills the session(s) and returns you to the repo's hub session.
#
# Worktree paths use the default template:
#   {{ repo_path }}/../{{ repo }}.{{ branch | sanitize }}
# e.g. ~/dev/myproject + feat/x -> ~/dev/myproject.feat-x
# (sessionizer picks these up at depth 1; dots become underscores in
# session names, so Ctrl+F / Ctrl+Space / Ctrl+G all work unmodified)

post-switch = "wt-tmux-jump {{ worktree_path }}"
# post-merge/post-remove run AFTER the worktree directory is gone (`wt hook
# --help`: "the active worktree is gone, so the hook runs in the primary
# worktree"), so wt-tmux-cleanup can no longer read <wt>/.git to recover an
# agent worktree's branch. Pass the branch as a 3rd arg — cleanup uses it to
# derive the session name directly instead of falling back to the basename.
post-merge = "wt-tmux-cleanup {{ worktree_path }} {{ repo }} {{ branch }}"
post-remove = "wt-tmux-cleanup {{ worktree_path }} {{ repo }} {{ branch }}"

# Auto-copy gitignored ENV/secrets/config into every new worktree so it is
# usable immediately (e.g. bin/ scripts that read .env* work at once). Runs
# synchronously before the worktree starts, but the fat regenerable caches are
# excluded below, so the copy is small + APFS-reflinked → effectively instant.
# Heavy caches are regenerated on demand in the worktree (uv sync / pnpm install
# / flutter pub get): a copied .venv isn't even relocatable (absolute shebangs +
# pyvenv.cfg point back at the hub), so regenerating is both fast-when-cache-warm
# and correct for the branch's lockfile. copy-ignored skips already-present files
# (no --force), so re-running on an existing worktree is a cheap no-op.
pre-start = "wt step copy-ignored"

# copy-ignored copies ALL gitignored files by default; exclude the fat,
# regenerable build/dep caches so only ENV/secrets/config/IDE settings copy over.
# (Built-in excludes already skip VCS/tool-state dirs.)
[step.copy-ignored]
exclude = [
  "node_modules",
  ".venv",
  ".dart_tool",
  "build",
  "target",
  "dist",
  ".next",
  ".turbo",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
]
